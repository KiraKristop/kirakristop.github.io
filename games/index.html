<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Динозаврик</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    background: #f7f7f7;
    font-family: 'Courier New', monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    transition: background 0.3s;
  }
  body.night { background: #1a1a2e; }

  .game-container {
    position: relative;
    width: 100%;
    max-width: 800px;
    height: 100vh;
    max-height: 500px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    max-width: 800px;
    aspect-ratio: 8 / 3;
    background: #f7f7f7;
    border-bottom: 3px solid #535353;
    touch-action: none;
    transition: background 0.3s, border-color 0.3s;
    outline: none;
  }
  body.night canvas {
    background: #1a1a2e;
    border-bottom-color: #b8b8d0;
  }

  .ui {
    position: absolute;
    top: 20px;
    right: 25px;
    display: flex;
    gap: 20px;
    font-size: 20px;
    font-weight: bold;
    color: #535353;
    letter-spacing: 2px;
    transition: color 0.3s;
    z-index: 2;
  }
  body.night .ui { color: #e0e0ff; }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(247, 247, 247, 0.85);
    text-align: center;
    padding: 20px;
    transition: background 0.3s;
    z-index: 3;
    cursor: pointer;
  }
  body.night .overlay { background: rgba(26, 26, 46, 0.9); }
  .overlay.hidden { display: none; }

  .overlay h1 {
    font-size: clamp(28px, 6vw, 52px);
    color: #535353;
    margin: 0 0 10px;
    letter-spacing: 4px;
    transition: color 0.3s;
  }
  body.night .overlay h1 { color: #e0e0ff; }

  .overlay p {
    font-size: clamp(14px, 2.5vw, 20px);
    color: #777;
    margin: 6px 0;
    transition: color 0.3s;
  }
  body.night .overlay p { color: #a0a0c0; }

  .overlay .hint {
    margin-top: 20px;
    font-size: clamp(12px, 2vw, 16px);
    color: #999;
    animation: blink 1.2s infinite;
  }
  body.night .overlay .hint { color: #7070a0; }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .controls-hint {
    position: absolute;
    bottom: 15px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 13px;
    color: #999;
    letter-spacing: 1px;
    transition: color 0.3s;
    pointer-events: none;
    z-index: 2;
  }
  body.night .controls-hint { color: #7070a0; }

  .jump-btn {
    position: absolute;
    bottom: 40px;
    right: 20px;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: rgba(83, 83, 83, 0.15);
    border: 2px solid rgba(83, 83, 83, 0.4);
    color: #535353;
    font-size: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 4;
    transition: all 0.1s;
    touch-action: none;
  }
  .jump-btn:active {
    background: rgba(83, 83, 83, 0.35);
    transform: scale(0.92);
  }
  body.night .jump-btn {
    background: rgba(184, 184, 208, 0.15);
    border-color: rgba(184, 184, 208, 0.4);
    color: #b8b8d0;
  }
  @media (min-width: 700px) {
    .jump-btn { display: none; }
  }
</style>
</head>
<body>

<div class="game-container">
  <canvas id="canvas" width="800" height="300" tabindex="0"></canvas>

  <div class="ui">
    <div>HI <span id="hiScore">00000</span></div>
    <div><span id="score">00000</span></div>
  </div>

  <div class="overlay" id="overlay">
    <h1>ДИНОЗАВРИК</h1>
    <p>Прыгай через кактусы и уклоняйся от птеродактилей</p>
    <p class="hint" id="hintText">Нажми ПРОБЕЛ или коснись экрана</p>
  </div>

  <div class="jump-btn" id="jumpBtn">▲</div>

  <div class="controls-hint">ПРОБЕЛ / ↑ / W / ТАП — прыжок &nbsp;•&nbsp; ↓ / S — присесть</div>
</div>

<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const hintText = document.getElementById('hintText');
  const scoreEl = document.getElementById('score');
  const hiScoreEl = document.getElementById('hiScore');
  const jumpBtn = document.getElementById('jumpBtn');

  const W = 800, H = 300;
  const GROUND_Y = 250;

  function setupCanvas() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  setupCanvas();
  window.addEventListener('resize', setupCanvas);

  const STATE = { MENU: 0, PLAYING: 1, GAME_OVER: 2 };
  let state = STATE.MENU;

  let score = 0;
  let hiScore = parseInt(localStorage.getItem('dinoHiScore') || '0', 10);
  hiScoreEl.textContent = String(hiScore).padStart(5, '0');

  let speed = 6;
  const BASE_SPEED = 6;
  const MAX_SPEED = 15;
  let frame = 0;

  const dino = {
    x: 60,
    y: GROUND_Y,
    w: 44,
    h: 48,
    vy: 0,
    gravity: 0.9,
    jumpPower: -15,
    onGround: true,
    ducking: false,
    legFrame: 0,
    legTimer: 0,
    blinkTimer: 0,
    blinking: false,
    dead: false
  };

  let obstacles = [];
  let clouds = [];
  let groundDecor = [];
  let birds = [];
  let particles = [];
  let nightMode = false;
  let nightTimer = 0;

  function spawnDust(x, y) {
    for (let i = 0; i < 3; i++) {
      particles.push({
        x, y,
        vx: -Math.random() * 2 - 1,
        vy: -Math.random() * 1.5,
        life: 20, maxLife: 20,
        size: Math.random() * 2 + 1
      });
    }
  }

  function resetGame() {
    score = 0;
    speed = BASE_SPEED;
    frame = 0;
    obstacles = [];
    birds = [];
    particles = [];
    clouds = [];
    groundDecor = [];
    dino.y = GROUND_Y;
    dino.vy = 0;
    dino.onGround = true;
    dino.ducking = false;
    dino.dead = false;
    nightMode = false;
    nightTimer = 0;
    document.body.classList.remove('night');
    initClouds();
    initGroundDecor();
  }

  function initClouds() {
    clouds = [];
    for (let i = 0; i < 4; i++) {
      clouds.push({
        x: Math.random() * W,
        y: 30 + Math.random() * 80,
        size: 30 + Math.random() * 20,
        speed: 0.3 + Math.random() * 0.4
      });
    }
  }

  function initGroundDecor() {
    groundDecor = [];
    for (let i = 0; i < 20; i++) {
      groundDecor.push({
        x: Math.random() * W,
        y: GROUND_Y + 5 + Math.random() * 15,
        w: 2 + Math.random() * 8,
        h: 1 + Math.random() * 3
      });
    }
  }

  function spawnObstacle() {
    const r = Math.random();
    if (r < 0.7) {
      const small = Math.random() < 0.6;
      const cactiCount = Math.random() < 0.4 ? 2 + Math.floor(Math.random() * 2) : 1;
      const baseW = small ? 17 : 25;
      const baseH = small ? 35 : 50;
      for (let i = 0; i < cactiCount; i++) {
        obstacles.push({
          x: W + i * (baseW + 4),
          y: GROUND_Y - baseH + 8,
          w: baseW, h: baseH,
          type: 'cactus', small
        });
      }
    } else {
      const heights = [GROUND_Y - 50, GROUND_Y - 85, GROUND_Y - 115];
      birds.push({
        x: W + 20,
        y: heights[Math.floor(Math.random() * heights.length)],
        w: 42, h: 30,
        frame: 0, frameTimer: 0
      });
    }
  }

  // ==== ПРЫЖОК ====
  function jump() {
    if (state === STATE.MENU) {
      startGame();
      return;
    }
    if (state === STATE.GAME_OVER) {
      if (frame > 25) startGame();
      return;
    }
    if (state === STATE.PLAYING && dino.onGround && !dino.dead) {
      dino.vy = dino.jumpPower;
      dino.onGround = false;
      dino.ducking = false;
      spawnDust(dino.x + dino.w / 2, GROUND_Y);
    }
  }

  function startGame() {
    resetGame();
    state = STATE.PLAYING;
    overlay.classList.add('hidden');
    canvas.focus();
  }

  function gameOver() {
    state = STATE.GAME_OVER;
    frame = 0;
    dino.dead = true;
    if (score > hiScore) {
      hiScore = score;
      localStorage.setItem('dinoHiScore', hiScore);
      hiScoreEl.textContent = String(hiScore).padStart(5, '0');
    }
    overlay.classList.remove('hidden');
    document.querySelector('.overlay h1').textContent = 'ИГРА ОКОНЧЕНА';
    document.querySelector('.overlay p').textContent = 'Счёт: ' + score;
    hintText.textContent = 'Нажми ПРОБЕЛ или коснись экрана';
  }

  // ==== УПРАВЛЕНИЕ ====
  // Ключевой момент: слушаем keydown на window с { capture: true }
  // Это гарантирует, что пробел будет пойман раньше, чем его обработает браузер
  const jumpKeys = [' ', 'Space', 'ArrowUp', 'Up', 'w', 'W', 'к', 'К', 'ц', 'Ц'];

  function isJumpKey(e) {
    // Проверяем по code (не зависит от раскладки) и по key
    return e.code === 'Space'
        || e.code === 'ArrowUp'
        || e.code === 'KeyW'
        || e.key === ' '
        || e.key === 'Spacebar'
        || e.key === 'ArrowUp'
        || e.key.toLowerCase() === 'w'
        || e.key.toLowerCase() === 'ц'; // W на русской раскладке
  }

  function isDuckKey(e) {
    return e.code === 'ArrowDown'
        || e.code === 'KeyS'
        || e.key === 'ArrowDown'
        || e.key.toLowerCase() === 's'
        || e.key.toLowerCase() === 'ы'; // S на русской раскладке
  }

  // Фаза capture — перехватываем раньше всех
  window.addEventListener('keydown', (e) => {
    if (isJumpKey(e)) {
      e.preventDefault();
      e.stopPropagation();
      // Игнорируем автоповтор (удержание клавиши)
      if (e.repeat) return;
      jump();
      return;
    }
    if (isDuckKey(e)) {
      e.preventDefault();
      e.stopPropagation();
      if (state === STATE.PLAYING) dino.ducking = true;
    }
  }, { capture: true });

  window.addEventListener('keyup', (e) => {
    if (isDuckKey(e)) {
      e.preventDefault();
      e.stopPropagation();
      dino.ducking = false;
    }
  }, { capture: true });

  // Дополнительная страховка: фокусируем окно при клике
  window.addEventListener('mousedown', () => {
    window.focus();
  });

  // Страховка от потери фокуса
  window.addEventListener('blur', () => {
    dino.ducking = false;
  });

  // ==== ТАЧ / МЫШЬ ====
  let pointerDown = false;

  function onPointerDown(e) {
    e.preventDefault();
    pointerDown = true;
    jump();
  }

  function onPointerUp() {
    pointerDown = false;
  }

  canvas.addEventListener('touchstart', onPointerDown, { passive: false });
  canvas.addEventListener('mousedown', onPointerDown);
  canvas.addEventListener('touchend', onPointerUp);
  canvas.addEventListener('mouseup', onPointerUp);
  canvas.addEventListener('touchcancel', onPointerUp);

  overlay.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); }, { passive: false });
  overlay.addEventListener('mousedown', (e) => { e.preventDefault(); jump(); });

  jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); }, { passive: false });
  jumpBtn.addEventListener('mousedown', (e) => { e.preventDefault(); jump(); });

  window.addEventListener('touchmove', (e) => {
    e.preventDefault();
  }, { passive: false });

  // Запрещаем скролл пробелом
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') e.preventDefault();
  }, { capture: true });

  // ==== ОБНОВЛЕНИЕ ====
  function update() {
    frame++;

    if (state !== STATE.PLAYING) {
      clouds.forEach(c => {
        c.x -= c.speed * 0.5;
        if (c.x + c.size < 0) { c.x = W + c.size; c.y = 30 + Math.random() * 80; }
      });
      if (state === STATE.GAME_OVER) {
        dino.legTimer++;
        if (dino.legTimer > 6) { dino.legTimer = 0; dino.legFrame = (dino.legFrame + 1) % 2; }
      }
      return;
    }

    if (speed < MAX_SPEED) speed += 0.0012;
    score = Math.floor(frame / 6);

    if (!dino.onGround) {
      dino.vy += dino.gravity;
      dino.y += dino.vy;
      if (dino.y >= GROUND_Y) {
        dino.y = GROUND_Y;
        dino.vy = 0;
        dino.onGround = true;
        spawnDust(dino.x + dino.w / 2, GROUND_Y);
      }
    }

    const currentH = dino.ducking && dino.onGround ? dino.h * 0.6 : dino.h;
    const currentY = GROUND_Y - currentH;

    dino.legTimer++;
    if (dino.legTimer > Math.max(3, 8 - Math.floor(speed / 2))) {
      dino.legTimer = 0;
      dino.legFrame = (dino.legFrame + 1) % 2;
    }

    dino.blinkTimer++;
    if (dino.blinkTimer > 100) {
      dino.blinking = !dino.blinking;
      dino.blinkTimer = 0;
    }

    const spawnRate = Math.max(50, 100 - speed * 3);
    if (frame % Math.floor(spawnRate) === 0 && frame > 40) {
      spawnObstacle();
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.x -= speed;
      if (o.x + o.w < 0) { obstacles.splice(i, 1); continue; }
      if (rectCollide(
        dino.x + 8, currentY + 4, dino.w - 16, currentH - 8,
        o.x + 3, o.y + 3, o.w - 6, o.h - 6
      )) { gameOver(); return; }
    }

    for (let i = birds.length - 1; i >= 0; i--) {
      const b = birds[i];
      b.x -= speed + 1.2;
      b.frameTimer++;
      if (b.frameTimer > 8) { b.frameTimer = 0; b.frame = (b.frame + 1) % 2; }
      if (b.x + b.w < 0) { birds.splice(i, 1); continue; }
      if (rectCollide(
        dino.x + 8, currentY + 4, dino.w - 16, currentH - 8,
        b.x + 8, b.y + 8, b.w - 16, b.h - 16
      )) { gameOver(); return; }
    }

    clouds.forEach(c => {
      c.x -= c.speed + speed * 0.05;
      if (c.x + c.size < 0) { c.x = W + c.size; c.y = 30 + Math.random() * 80; }
    });

    groundDecor.forEach(g => {
      g.x -= speed;
      if (g.x + g.w < 0) {
        g.x = W + Math.random() * 100;
        g.y = GROUND_Y + 5 + Math.random() * 15;
      }
    });

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }

    nightTimer++;
    if (score > 0 && score % 700 === 0 && nightTimer > 60) {
      nightMode = !nightMode;
      document.body.classList.toggle('night', nightMode);
      nightTimer = 0;
    }

    scoreEl.textContent = String(score).padStart(5, '0');
  }

  function rectCollide(x1, y1, w1, h1, x2, y2, w2, h2) {
    return x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2;
  }

  // ==== РИСОВАНИЕ ====
  const FG = '#535353';
  const BG_NIGHT = '#b8b8d0';
  function getColor() { return nightMode ? BG_NIGHT : FG; }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    const c = getColor();

    ctx.strokeStyle = c;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y + 2);
    ctx.lineTo(W, GROUND_Y + 2);
    ctx.stroke();

    ctx.fillStyle = c;
    groundDecor.forEach(g => ctx.fillRect(g.x, g.y, g.w, g.h));

    ctx.strokeStyle = c;
    clouds.forEach(cl => {
      ctx.beginPath();
      ctx.arc(cl.x, cl.y, cl.size * 0.5, Math.PI, 0);
      ctx.arc(cl.x + cl.size * 0.6, cl.y - cl.size * 0.15, cl.size * 0.4, Math.PI, 0);
      ctx.arc(cl.x - cl.size * 0.6, cl.y - cl.size * 0.1, cl.size * 0.35, Math.PI, 0);
      ctx.stroke();
    });

    ctx.fillStyle = c;
    obstacles.forEach(o => drawCactus(o.x, o.y, o.w, o.h, o.small));
    birds.forEach(b => drawBird(b.x, b.y, b.w, b.h, b.frame));

    ctx.fillStyle = nightMode ? '#7a7aa0' : '#aaa';
    particles.forEach(p => {
      ctx.globalAlpha = p.life / p.maxLife;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    });
    ctx.globalAlpha = 1;

    drawDino();
  }

  function drawCactus(x, y, w, h, small) {
    const c = getColor();
    ctx.fillStyle = c;
    if (small) {
      ctx.fillRect(x + w * 0.35, y, w * 0.3, h);
      ctx.fillRect(x, y + h * 0.3, w * 0.3, h * 0.25);
      ctx.fillRect(x + w * 0.7, y + h * 0.2, w * 0.3, h * 0.3);
    } else {
      ctx.fillRect(x + w * 0.35, y, w * 0.3, h);
      ctx.fillRect(x, y + h * 0.25, w * 0.35, h * 0.3);
      ctx.fillRect(x + w * 0.65, y + h * 0.35, w * 0.35, h * 0.25);
    }
  }

  function drawBird(x, y, w, h, frame) {
    const c = getColor();
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.ellipse(x + w / 2, y + h / 2, w * 0.3, h * 0.25, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + w * 0.75, y + h * 0.4, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x + w * 0.8, y + h * 0.35);
    ctx.lineTo(x + w * 0.95, y + h * 0.42);
    ctx.lineTo(x + w * 0.8, y + h * 0.48);
    ctx.fill();
    ctx.beginPath();
    if (frame === 0) {
      ctx.moveTo(x + w * 0.4, y + h * 0.5);
      ctx.lineTo(x + w * 0.5, y - 5);
      ctx.lineTo(x + w * 0.65, y + h * 0.5);
    } else {
      ctx.moveTo(x + w * 0.4, y + h * 0.5);
      ctx.lineTo(x + w * 0.5, y + h + 5);
      ctx.lineTo(x + w * 0.65, y + h * 0.5);
    }
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x + w * 0.15, y + h * 0.4);
    ctx.lineTo(x - 5, y + h * 0.3);
    ctx.lineTo(x + w * 0.15, y + h * 0.6);
    ctx.fill();
  }

  function drawDino() {
    const c = getColor();
    ctx.fillStyle = c;
    const ducking = dino.ducking && dino.onGround && !dino.dead;
    const w = ducking ? dino.w * 1.3 : dino.w;
    const h = ducking ? dino.h * 0.6 : dino.h;
    const x = dino.x;
    const y = GROUND_Y - h;

    if (dino.dead) {
      ctx.fillRect(x + 8, y + 8, w - 16, h - 16);
      ctx.strokeStyle = nightMode ? '#1a1a2e' : '#f7f7f7';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x + w * 0.6, y + 12);
      ctx.lineTo(x + w * 0.75, y + 22);
      ctx.moveTo(x + w * 0.75, y + 12);
      ctx.lineTo(x + w * 0.6, y + 22);
      ctx.stroke();
      ctx.fillStyle = c;
      ctx.fillRect(x + 6, GROUND_Y - 6, 8, 6);
      ctx.fillRect(x + 22, GROUND_Y - 6, 8, 6);
      return;
    }

    ctx.fillRect(x - 8, y + h * 0.3, 12, 6);
    ctx.fillRect(x, y, w, h - 8);
    ctx.fillRect(x + w - 5, y - 4, 18, 18);

    if (!dino.blinking) {
      ctx.fillStyle = nightMode ? '#1a1a2e' : '#f7f7f7';
      ctx.fillRect(x + w + 4, y + 2, 5, 5);
      ctx.fillStyle = c;
    }

    ctx.fillRect(x + w + 8, y + 12, 8, 2);

    if (!dino.onGround || dino.dead) {
      ctx.fillRect(x + 8, y + h - 8, 7, 8);
      ctx.fillRect(x + w - 16, y + h - 8, 7, 8);
    } else if (dino.ducking) {
      ctx.fillRect(x + 8, GROUND_Y - 5, 7, 5);
      ctx.fillRect(x + w - 16, GROUND_Y - 5, 7, 5);
    } else {
      if (dino.legFrame === 0) {
        ctx.fillRect(x + 8, y + h - 8, 7, 8);
        ctx.fillRect(x + w - 16, y + h - 4, 7, 4);
      } else {
        ctx.fillRect(x + 8, y + h - 4, 7, 4);
        ctx.fillRect(x + w - 16, y + h - 8, 7, 8);
      }
    }

    ctx.fillRect(x + w - 10, y + h * 0.5, 8, 4);
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  resetGame();
  loop();

  // Автофокус канваса для гарантии перехвата клавиш
  canvas.focus();
})();
</script>
</body>
</html>
